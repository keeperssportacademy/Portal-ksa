<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Keepers Sport Academy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .brand-yellow { background-color: #FFDE00; }
        .brand-dark { background-color: #111111; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Cabecera del Panel con Logotipo -->
    <header class="brand-dark border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="Logo de Nombre con Iniciales Circular Tipográfico Blanco y Negro_20260917_095359_0000.png" alt="Logo KSA" class="w-12 h-12 object-cover rounded-full border-2 border-[#FFDE00]">
                <div>
                    <h1 class="font-bold text-lg tracking-wider text-white">KEEPERS SPORT ACADEMY</h1>
                    <span class="text-xs text-[#FFDE00] font-medium">Panel de Control Administrativo</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="reloj-venezuela" class="text-xs text-gray-400 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800"></span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Pestaña / Sección Atletas KSA -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-[#FFDE00]"></i> Gestión de Atletas KSA
                    </h2>
                    <p class="text-xs text-gray-400">Base de datos oficial de jugadores y arqueros de la academia.</p>
                </div>
                <button onclick="abrirModalAtleta()" class="brand-yellow text-gray-950 font-bold px-4 py-2.5 rounded-xl text-sm flex items-center gap-2 hover:opacity-90 transition cursor-pointer">
                    <i class="fa-solid fa-user-plus"></i> Añadir Atleta
                </button>
            </div>

            <!-- Tabla de Atletas -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 uppercase bg-gray-950/50">
                            <th class="p-3">Atleta</th>
                            <th class="p-3">Categoría</th>
                            <th class="p-3">Posición</th>
                            <th class="p-3">Contacto</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-atletas-body" class="divide-y divide-gray-800 text-sm">
                        <!-- Inyección dinámica con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Modal Añadir / Editar Atleta -->
    <div id="modal-atleta" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <h3 id="modal-titulo" class="text-lg font-bold text-white mb-4">Registrar Nuevo Atleta</h3>
            
            <form id="form-atleta" onsubmit="guardarAtleta(event)" class="space-y-4">
                <input type="hidden" id="atleta-id">
                
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Nombre Completo</label>
                    <input type="text" id="atleta-nombre" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#FFDE00]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Categoría</label>
                        <input type="text" id="atleta-categoria" placeholder="Ej. Sub-15" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#FFDE00]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Posición</label>
                        <select id="atleta-posicion" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#FFDE00]">
                            <option value="Arquero">Arquero</option>
                            <option value="Defensa">Defensa</option>
                            <option value="Mediocampista">Mediocampista</option>
                            <option value="Delantero">Delantero</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Teléfono</label>
                    <input type="text" id="atleta-telefono" placeholder="0424-XXXXXXX" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#FFDE00]">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">URL de Avatar / Foto</label>
                    <input type="url" id="atleta-avatar" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-[#FFDE00]">
                </div>

                <div class="flex justify-end space-x-3 pt-3">
                    <button type="button" onclick="cerrarModalAtleta()" class="px-4 py-2 rounded-xl text-sm bg-gray-800 text-gray-300 hover:bg-gray-700 transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="brand-yellow text-gray-950 font-bold px-5 py-2 rounded-xl text-sm hover:opacity-90 transition cursor-pointer">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Gestión Local y Reloj -->
    <script>
        // Base de datos simulada en localStorage
        let atletas = JSON.parse(localStorage.getItem('ksa_atletas')) || [
            { id: 1, nombre: 'Alejandro Martínez', categoria: 'Sub-17', posicion: 'Arquero', telefono: '0424-6891083', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop' }
        ];

        function actualizarRelojVenezuela() {
            const opciones = { timeZone: 'America/Caracas', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const horaStr = new Intl.DateTimeFormat('es-VE', opciones).format(new Date());
            document.getElementById('reloj-venezuela').innerHTML = `<i class="fa-regular fa-clock text-[#FFDE00] mr-1.5"></i> ${horaStr} (Maracaibo)`;
        }
        setInterval(actualizarRelojVenezuela, 1000);
        actualizarRelojVenezuela();

        function renderizarTabla() {
            const tbody = document.getElementById('tabla-atletas-body');
            tbody.innerHTML = '';
            
            if(atletas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No hay atletas registrados en la base de datos.</td></tr>`;
                return;
            }

            atletas.forEach(atleta => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-900/50 transition">
                        <td class="p-3 flex items-center gap-3">
                            <img src="${atleta.avatar || 'https://via.placeholder.com/40'}" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-gray-700">
                            <span class="font-medium text-white">${atleta.nombre}</span>
                        </td>
                        <td class="p-3 text-gray-300">${atleta.categoria}</td>
                        <td class="p-3"><span class="bg-gray-800 text-[#FFDE00] px-2.5 py-1 rounded-full text-xs font-semibold">${atleta.posicion}</span></td>
                        <td class="p-3 text-gray-400">${atleta.telefono || 'S/N'}</td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="editarAtleta(${atleta.id})" class="text-blue-400 hover:text-blue-300 p-1.5 cursor-pointer" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="borrarAtleta(${atleta.id})" class="text-red-400 hover:text-red-300 p-1.5 cursor-pointer" title="Borrar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function abrirModalAtleta() {
            document.getElementById('modal-titulo').innerText = 'Registrar Nuevo Atleta';
            document.getElementById('form-atleta').reset();
            document.getElementById('atleta-id').value = '';
            document.getElementById('modal-atleta').classList.remove('hidden');
            document.getElementById('modal-atleta').classList.add('flex');
        }

        function cerrarModalAtleta() {
            document.getElementById('modal-atleta').classList.remove('flex');
            document.getElementById('modal-atleta').classList.add('hidden');
        }

        function guardarAtleta(event) {
            event.preventDefault();
            const id = document.getElementById('atleta-id').value;
            const nombre = document.getElementById('atleta-nombre').value;
            const categoria = document.getElementById('atleta-categoria').value;
            const posicion = document.getElementById('atleta-posicion').value;
            const telefono = document.getElementById('atleta-telefono').value;
            const avatar = document.getElementById('atleta-avatar').value || 'https://via.placeholder.com/100';

            if(id) {
                // Editar
                atletas = atletas.map(a => a.id == id ? { ...a, nombre, categoria, posicion, telefono, avatar } : a);
            } else {
                // Añadir
                const nuevoId = atletas.length > 0 ? Math.max(...atletas.map(a => a.id)) + 1 : 1;
                atletas.push({ id: nuevoId, nombre, categoria, posicion, telefono, avatar });
            }

            localStorage.setItem('ksa_atletas', JSON.stringify(atletas));
            cerrarModalAtleta();
            renderizarTabla();
        }

        function editarAtleta(id) {
            const atleta = atletas.find(a => a.id == id);
            if(!atleta) return;
            
            document.getElementById('modal-titulo').innerText = 'Editar Atleta';
            document.getElementById('atleta-id').value = atleta.id;
            document.getElementById('atleta-nombre').value = atleta.nombre;
            document.getElementById('atleta-categoria').value = atleta.categoria;
            document.getElementById('atleta-posicion').value = atleta.posicion;
            document.getElementById('atleta-telefono').value = atleta.telefono;
            document.getElementById('atleta-avatar').value = atleta.avatar;

            document.getElementById('modal-atleta').classList.remove('hidden');
            document.getElementById('modal-atleta').classList.add('flex');
        }

        function borrarAtleta(id) {
            if(confirm('¿Estás seguro de eliminar este atleta de la base de datos?')) {
                atletas = atletas.filter(a => a.id != id);
                localStorage.setItem('ksa_atletas', JSON.stringify(atletas));
                renderizarTabla();
            }
        }

        // Inicializar tabla al cargar
        renderizarTabla();
    </script>
</body>
</html>
